# Root Cargo workspace for the Prometheus Companion.
#
# Shape follows the HMA tray-app scaffold (`scripts/scaffold-tauri-tray.sh`):
# one workspace, `crates/<name>` for logic and `src-tauri/` for the Tauri shell.
# graph-explorer uses the same single-workspace layout; know-me's split
# workspace with a hand-mirrored `[patch]` table is the documented failure mode
# we are avoiding — it produces "desktop build breaks while cargo check is
# green".
#
# Dependency direction (operator decision D-02, option D): this repository
# consumes prometheus-skill-pack crates by git rev. The pack never depends on
# the Companion. A `path` dependency into the pack, or a committed `[patch]`
# pointing at a local checkout, is a defect — it makes the build depend on a
# working copy no other machine has.
#
# Every version below is pinned from `versions.toml`, which is authoritative
# and hand-edited by the operator (`.claude/settings.json` denies agents
# `Edit(versions.toml)`).

[workspace]
resolver = "2"
members = [
    "crates/prometheus-substrate",
    # Relocated from the pack by change-cpc-004. These are the control plane
    # itself: sync, replication, and peer transport.
    "crates/sovereign-sync",
    "crates/sovereign-client",
    "crates/kbd-mobile",
    "crates/iroh-docs-adapter",
    "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
authors = ["Travis James <tjames@prometheusags.ai>"]

[workspace.dependencies]
# --- prometheus-skill-pack, consumed by git rev (never by path) -------------
# Full v1.17.0 supplies the signed co-operator event reader and standalone storage traits.
kbd-runtime = { git = "https://github.com/Prometheus-AGS/prometheus-skill-system", rev = "acd029107533c07a661a7e3ad90eb28834688afa" }
storage-provider = { git = "https://github.com/Prometheus-AGS/prometheus-skill-system", rev = "acd029107533c07a661a7e3ad90eb28834688afa", default-features = false }
learner-model = { git = "https://github.com/Prometheus-AGS/prometheus-skill-system", rev = "acd029107533c07a661a7e3ad90eb28834688afa" }
prometheus-skill-index = { git = "https://github.com/Prometheus-AGS/prometheus-skill-system", rev = "acd029107533c07a661a7e3ad90eb28834688afa" }

# --- pinned in versions.toml ------------------------------------------------
# keyring is EXACT: kbd-runtime pins `=3.6.3` and holds the device key as
# credential-store item `prometheus-kbd-device`. A caret range would admit a
# second major version of keyring into one graph.
keyring = "=3.6.3"
# `versions.toml` names this `dirs_next` (a TOML key cannot contain a hyphen);
# the crate on crates.io is `dirs-next`. Same pin, correct package name.
dirs-next = "2"
axum = "0.8"
# iroh stack — owner-approved floor 1.0.3, matching versions.toml.
iroh = "1.0.3"
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
iroh-docs = { version = "0.101", default-features = false, features = ["fs-store"] }
iroh-gossip = "0.101"
# Address lookup (change-cpc-006). Both depend on `iroh ^1.0.0`, satisfied by the
# workspace's iroh; verified against crates.io before adding. Repo:
# n0-computer/iroh-address-lookups.
iroh-mdns-address-lookup = "0.5.0"
iroh-mainline-address-lookup = "0.5.0"
loro = "1.13"
redb = "2"
rmcp = { version = "1.8", features = ["server", "client", "transport-io", "transport-child-process", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# NOTE: `panic = "abort"` is deliberately absent here. HMA forbids it on FFI
# release profiles, and the substrate is linked into a shell that will grow an
# FFI surface. src-tauri keeps its own profile for the shipped binary.
strip = true
