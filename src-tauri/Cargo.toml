[package]
name = "prometheus-companion"
description = "Prometheus Companion — the control and extension framework for prometheus-skill-pack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prometheus_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
dirs-next = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

# The substrate: the node this shell hosts and the supervisor that adopts the
# skill pack's services. `desktop` is the preset the windowed shell links;
# the headless preset is for the integration harness and server deployments.
prometheus-substrate = { path = "../crates/prometheus-substrate", features = ["desktop"], default-features = false }


# NOTE: [profile.*] lives in the workspace root manifest. Cargo ignores profile
# sections in non-root packages, so keeping a copy here would be a silent lie
# about the build settings.
