[package]
name = "sovereign-sync"
version = "1.8.0"
edition = "2021"
description = "The Companion control-plane node: P2P CRDT sync daemon, MCP server, and REST API over the skill pack's signed KBD runtime"

[[bin]]
name = "sovereign-sync"
path = "src/main.rs"

[lib]
name = "sovereign_sync"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Config
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
uuid = { version = "1", features = ["v4"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
bytes = "1"
futures = "0.3"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }

# HTTP server
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
nix = { version = "0.31", features = ["user"] }

# CRDT
loro = "1.13"

# P2P (iroh 1.0.0 stable — released June 15, 2026)
# Floor is 1.0.2: it fixed a relay DoS where one malformed datagram from any
# client crashed an entire relay, disconnecting every peer using it. The lockfile
# here previously pinned 1.0.0 — the vulnerable version.
iroh = "1.0.2"
iroh-gossip = "0.101"
# Discovery (change-cpc-006). mDNS finds peers on a LAN with no bootstrap entry;
# Mainline resolves an EndpointId over the public DHT. Neither grants admission —
# that stays Ed25519 pairing + the endpoint allowlist.
iroh-mdns-address-lookup = { workspace = true }
iroh-mainline-address-lookup = { workspace = true }
blake3 = "1"

# MCP server (rmcp 1.8 — official modelcontextprotocol/rust-sdk)
rmcp = { version = "1.8", features = ["server", "client", "transport-io", "transport-child-process", "macros"] }
schemars = "1.0"

# Persistence
redb = "2"

# Error handling
thiserror = "1"
anyhow = "1"

# Dirs
dirs-next = "2"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pack crates: git rev only. The pack never depends on the Companion
# (operator decision D-02, option D); this direction is one-way.
storage-provider = { workspace = true }
kbd-runtime = { workspace = true }
learner-model = { workspace = true }
prometheus-skill-index = { workspace = true }
async-trait = "0.1"
# Existing local SDK; no new external dependency or pack dependency direction.
sovereign-client = { path = "../sovereign-client" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
# Local workspace member (relocated alongside this crate).
kbd-mobile = { path = "../kbd-mobile" }
